<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hold’em Tournament Trainer</title>
    <style>
      :root {
        --bg: #eef2ee;
        --pn: #fff;
        --ink: #16201a;
        --mu: #5d6b62;
        --ln: #d3dcd5;
        --ac: #b8451a;
        --bad: #b3261e;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0e1411;
          --pn: #18211c;
          --ink: #e8efe9;
          --mu: #93a398;
          --ln: #2a362f;
          --ac: #e0773a;
          --bad: #ff7b72;
        }
      }

      :root[data-theme='dark'] {
        --bg: #0e1411;
        --pn: #18211c;
        --ink: #e8efe9;
        --mu: #93a398;
        --ln: #2a362f;
        --ac: #e0773a;
        --bad: #ff7b72;
      }

      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.4 system-ui, -apple-system, sans-serif;
      }

      .wrap {
        max-width: 1020px;
        margin: auto;
        padding: 12px;
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
        align-items: start;
      }

      @media (max-width: 820px) {
        .wrap {
          grid-template-columns: 1fr;
        }
      }

      main,
      aside {
        display: grid;
        gap: 10px;
      }

      .pn {
        background: var(--pn);
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 10px 12px;
      }

      h3 {
        margin: 0 0 4px;
        font-size: 15px;
      }

      p {
        margin: 4px 0;
      }

      .table {
        position: relative;
        height: 440px;
        border-radius: 50% / 42%;
        background: radial-gradient(#238455, #0f4a2e);
        border: 8px solid #5a3a22;
      }

      .seat {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 92px;
        text-align: center;
        background: rgba(8, 20, 14, 0.74);
        color: #fff;
        border-radius: 10px;
        padding: 4px 2px;
        font-size: 12px;
        line-height: 1.25;
      }

      .seat small {
        display: block;
        min-height: 14px;
        color: #ffd9a0;
      }

      .seat .t {
        color: #9fd3b4;
        min-height: 0;
      }

      .turn {
        box-shadow: 0 0 0 3px #ffd34d;
      }

      .fold {
        opacity: 0.45;
      }

      .out {
        opacity: 0.25;
      }

      .d {
        background: #ffd34d;
        color: #000;
        border-radius: 50%;
        padding: 0 5px;
        font-style: normal;
        font-size: 10px;
      }

      .cd {
        display: inline-block;
        width: 26px;
        height: 36px;
        box-sizing: border-box;
        margin: 1px;
        padding-top: 2px;
        border-radius: 4px;
        background: #fff;
        color: #111;
        font: 700 13px/1.05 system-ui;
        border: 1px solid #888;
      }

      .cd.r {
        color: #c0182d;
      }

      .cd.bk {
        background: repeating-linear-gradient(45deg, #2b5aa8, #2b5aa8 4px, #1f4585 4px, #1f4585 8px);
        border-color: #fff;
      }

      .me .cd {
        width: 36px;
        height: 50px;
        font-size: 17px;
      }

      .mid .cd {
        width: 34px;
        height: 46px;
        font-size: 16px;
      }

      .mid {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #fff;
        width: 210px;
      }

      #msg {
        font-size: 13px;
        min-height: 18px;
        color: #ffd9a0;
      }

      button {
        font: inherit;
        padding: 9px 14px;
        border-radius: 9px;
        border: 1px solid var(--ln);
        background: var(--pn);
        color: var(--ink);
        cursor: pointer;
      }

      button.pri {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }

      .bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .sz {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        width: 100%;
      }

      .sz button {
        padding: 4px 8px;
        font-size: 12px;
      }

      .sz input {
        flex: 1;
        min-width: 120px;
      }

      #log {
        height: 200px;
        overflow: auto;
        font-size: 13px;
        color: var(--mu);
      }

      #log .w {
        color: var(--bad);
      }

      #log .b {
        color: var(--ac);
        font-weight: 600;
      }

      #end {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      #end .pn {
        max-width: 380px;
      }

      .mu {
        color: var(--mu);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <main>
        <div class="pn" id="info"></div>

        <div class="table" id="tb"></div>

        <div class="bar" id="act" style="display: none">
          <button id="bf">Fold</button>
          <button id="bc"></button>
          <button id="br" class="pri"></button>

          <div class="sz" id="sz">
            <input type="range" id="sl" step="1" aria-label="Raise amount" />
            <button onclick="pre(0)">Min</button>
            <button onclick="pre(.5)">½ pot</button>
            <button onclick="pre(.75)">¾ pot</button>
            <button onclick="pre(1)">Pot</button>
            <button onclick="pre(99)">All-in</button>
          </div>
        </div>

        <div class="bar">
          <button id="nx" class="pri" style="display: none">Deal next hand</button>
        </div>

        <div class="mu">Keys: F fold · C call/check · R raise · Space next hand</div>
      </main>

      <aside>
        <div class="pn">
          <label class="mu"><input type="checkbox" id="hint" checked /> Coach and opponent types</label>
          <div id="coach"></div>
        </div>

        <div class="pn">
          <h3>Hand log</h3>
          <div id="log"></div>
        </div>
      </aside>
    </div>

    <div id="end"></div>

    <script src="script.js"></script>
  </body>
</html>
